# mise-seo's own tasks, for working on mise-seo itself: run every task here, at the top. A repo that uses mise-seo
# gets nothing from this file: it gets mise-seo's binary and its tasks from mise-seo init (templates/), and its Go
# packages, misecheck and walk, from the module. Each task is named for what it acts on (noun:verb):
#   root: this repo itself
#     mise run root:ci                 what GitHub's CI runs, here the same: root:verify, then new-tool:e2e
#     mise run root:verify             the checks at once, then the walks in turn
#     mise run root:check-mise         misecheck on this very file: one line each, its Go there, usage by name, no shell syntax
#     mise run root:update             this repo's own pins at their newest, by the binary's own update, from source
#     mise run root:show-users         which of joeblew999's repos use mise-seo, at what version (after every release)
#   tool: mise-seo itself, its binary and its packages
#     mise run tool:test               go vet, the Go tests (the template broken eleven ways, the walk, the binary), the release config
#     mise run tool:build              the binary, bin/mise-seo (.exe on Windows)
#     mise run tool:install            that build as the mise version local, the template's on this machine (and any repo's)
#     mise run tool:release            a release from the commit checked out, as release.yml runs it (--dry-run)
#   template: the template, templates/, a whole repo that runs where it is
#     mise run template:check-mise     misecheck on its tasks, both ways: the binary's Go, the walk, the skill, the docs page
#     mise run template:e2e            the walk on it, where it is: init, check and show, each checked
#     mise run template:e2e-update     a copy of it given old pins of every kind: each update moves its own
#     mise run template:update         its own pins at their newest, by its own task (mise-seo:update)
#   new-repo: a new repo, made from nothing as docs/mise-seo/README.md says, by the walk and gone after it
#     mise run new-repo:e2e            the walk on it: init, check and show, each checked (--version: at a release)
#     mise run new-repo:e2e-update     one given old pins of every kind (node, wrangler, Go modules, a major among them)
#   new-tool: a new mise tool repo, made by mise-seo new-tool, by the walk and gone after it
#     mise run new-tool:e2e            its own root:verify must pass (--version: at a release)

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]
# mise 2026.10 fails to install a tool while it fetches its agent skill (a 404); it isn't needed.
skills.fetch = false

[tools]
usage = { version = "7.2.0", workflow = "publish-cli.yml" }    # --help and tab-completion for the tasks' flags
goreleaser = "2.20.0"   # the release's binaries (.goreleaser.yaml)
"go:github.com/oligot/go-mod-upgrade" = "0.13.0"   # the Go module upgrader update-go runs: the pin of cmd/mise-seo's goModUpgrade (TestPin), here so update-mise moves it and no importer's go.mod carries it

[tasks."root:ci"]
description = "What GitHub's CI runs (ci.yml runs exactly this), here the same: root:verify, then new-tool:e2e, a new mise tool repo made by new-tool, its own root:verify run. new-tool:e2e isn't in root:verify, which it runs in the repo it makes: there, it would make one again"
depends = ["root:verify"]
run = "mise run new-tool:e2e"

[tasks."root:verify"]
description = "The checks and the walks, all but new-tool:e2e (root:ci, what GitHub's CI runs, adds it): tool:test, root:check-mise and template:check-mise at once, then the walks one after the other (template:e2e, template:e2e-update, new-repo:e2e), as they share the machine's one aube store: two installing at once read each other's half-written packages"
depends = ["tool:test", "root:check-mise", "template:check-mise"]
run = "mise run template:e2e-update && mise run new-repo:e2e"

[tasks."root:check-mise"]
description = "misecheck on this repo's own mise.toml, the file this task is in: each task one line, the Go it runs there, its usage passed by name, no POSIX shell syntax, so every task here runs on Windows too"
run = 'go test . -run "^TestRootMise$" -count=1 -v'

[tasks."root:update"]
description = "This repo's own pins at their newest releases, by the binary's own update, from source: mise.toml's tools and go.mod's Go and modules (go-mod-upgrade's pin in mise.toml among them: then TestPin says to move cmd/mise-seo's pin of it too). Then tool:test and the walks prove it"
run = "go run ./cmd/mise-seo update"

[tasks."root:show-users"]
description = "Which of the owner's repos on GitHub use mise-seo, by the binary's own show-users, from source: its Go module in their go.mod, its binary in their mise files, at the versions each pins, the ones behind the newest release marked. tool:release runs it after every release"
run = "go run ./cmd/mise-seo show-users"

[tasks."tool:test"]
description = "go vet, the tests of the checker (what it reads of a mise file, how it reads a run line, the template broken nine ways), the walk and the binary (none of them walk), and the release config (goreleaser check)"
run = 'go vet ./... && go test ./... -count=1 && goreleaser check'

[tasks."tool:build"]
description = "The binary, bin/mise-seo (mise-seo.exe on Windows: go build names it for the OS)"
run = "go build -o bin/ ./cmd/mise-seo"

[tasks."tool:install"]
description = "This checkout's build as the mise version local, for any repo on this machine, no release: mise use github:joeblew999/mise-seo@local there. The template pins a release in .mise/config.toml; this writes templates/.mise/config.local.toml, never committed, so the template runs this build here"
depends = ["tool:build"]
run = "mise link -f github:joeblew999/mise-seo@local {{config_root}}/bin && mise use -q --path {{config_root}}/templates/.mise/config.local.toml github:joeblew999/mise-seo@local"

[tasks."tool:release"]
description = "A release of mise-seo from the commit checked out, as release.yml runs it on GitHub: the commit's v* tag, or the next patch version tagged and pushed; goreleaser's binaries on that tag's release; a new repo made at it and walked (new-repo:e2e --version); the version on proxy.golang.org; then root:show-users, the repos that could move to it. --dry-run tags and publishes nothing (a goreleaser snapshot into dist/). After tool:test"
usage = 'flag "--dry-run" help="tag and publish nothing: goreleaser builds a snapshot into dist/"'
depends = ["tool:test"]
run = 'go test . -run "^TestToolRelease$" -count=1 -v -timeout 30m{% if usage.dry_run %} -args -dry-run{% endif %}'

[tasks."template:check-mise"]
description = "misecheck on the template's tasks file, both ways: against the binary's Go (each task's command is its file, each command file is a task's, each flag on both sides), against the walk that runs them (each task it names is one), and against the skill and the docs page (each names every task and flag, and only tasks there are)"
run = 'go test . -run "^TestTemplateMise$" -count=1 -v'

[tasks."template:e2e"]
description = "TestWalkTemplate: the template, templates/, where it is: the tasks a repo meets in turn (mise-seo:init, check, show), through its own mise file, each checked (e2e_walk_test.go). After tool:install"
depends = ["tool:install"]
run = 'go test . -run "^TestWalkTemplate$" -count=1 -v -timeout 15m'

[tasks."template:e2e-update"]
description = "After template:e2e, as both use the template: TestUpdateTemplate, on the template, templates/, as it is, copied into a folder of its own, with the go.mod mise-seo:template writes into a repo: given old pins of every kind (node in mise.toml, wrangler in package.json, go-chi/chi v1 and google/uuid in go.mod), mise-seo:update-mise, update-packages and update-go must each move its own and nothing else, chi to /v5 with its import rewritten; then update has nothing left, and verify passes. On a copy of the template as it is, in a folder of its own: the template itself never changes, even when the walk is stopped half way. After tool:install"
depends = ["tool:install", "template:e2e"]
run = 'go test . -run "^TestUpdateTemplate$" -count=1 -v -timeout 20m'

[tasks."template:update"]
description = "The template's own pins at their newest releases, by its own task, mise-seo:update, run in templates/ as in a repo on its own (MISE_CEILING_PATHS): node, aube, wrangler, and mise-seo's release pin in .mise/config.toml (the machine's .mise/config.local.toml ignored). It ends with every pin, the moved ones before → after. Then the walks prove it. After tool:install"
depends = ["tool:install"]
dir = "{{config_root}}/templates"
env = { MISE_CEILING_PATHS = "{{config_root}}", MISE_IGNORED_CONFIG_PATHS = "{{config_root}}/templates/.mise/config.local.toml" }
run = "mise run mise-seo:update"

[tasks."new-repo:e2e"]
description = "TestWalkNewRepo: a new repo, made from nothing as docs/mise-seo/README.md says (an empty folder with its own git, mise-seo init at this checkout's build, then mise-seo:template: its app, packages and go.mod), its tasks init, check and show each checked. At this checkout's build, or the release --version names, as new-repo.yml tries each release. Gone after it. After tool:install"
usage = 'flag "--version <version>" help="make it at this release of mise-seo from GitHub, as mise exec does, instead of the build of this checkout"'
depends = ["tool:install"]
run = 'go test . -run "^TestWalkNewRepo$" -count=1 -v -timeout 15m{% if usage.version %} -args -version "{{usage.version}}"{% endif %}'

[tasks."new-repo:e2e-update"]
description = "TestUpdateNewRepo: a new repo, made as new-repo:e2e makes it, given old pins of every kind (node in mise.toml, wrangler in package.json, go-chi/chi v1 and google/uuid in go.mod); mise-seo:update must move every one, chi to /v5 with its import rewritten, then mise-seo:verify pass. Gone after it. After tool:install"
depends = ["tool:install"]
run = 'go test . -run "^TestUpdateNewRepo$" -count=1 -v -timeout 20m'

[tasks."new-tool:e2e"]
description = "TestWalkNewTool: a new mise tool repo, made by mise-seo new-tool in an empty folder with its own git (at this checkout's build, copying this checkout, or the release --version names, copying it from Go's module proxy), then its own root:verify must pass: its misecheck, tool tests and walks, on its renamed binary. Gone after it. Not in root:verify, which it runs in the repo it makes, where it would make one again: root:ci runs it after root:verify, and new-repo.yml at every release, on each OS. Its repo is joeblew999/mise-new-tool, empty on GitHub, so mise can list its releases. After tool:install"
usage = 'flag "--version <version>" help="make it at this release of mise-seo from GitHub, as mise exec does, instead of the build of this checkout"'
depends = ["tool:install"]
run = 'go test . -run "^TestWalkNewTool$" -count=1 -v -timeout 30m{% if usage.version %} -args -version "{{usage.version}}"{% endif %}'
