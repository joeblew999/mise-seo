# mise-seo's own tasks, for working on mise-seo itself: run every task here, at the top. A repo that uses mise-seo
# gets nothing from this file: it gets mise-seo's binary and its tasks from mise-seo init (templates/), and its Go
# packages from the module. The steps a person takes are a repo's own tasks (seo:init to seo:inspect, in its
# .mise/tasks), in an order the walk and the docs page say; the walks (e2e_walk_test.go) run them in order, on the template or on a new repo made from it. Each
# task here is named for what it acts on (noun:verb):
#   root: this repo itself
#     mise run root:ci                 what GitHub's CI runs, here the same: root:verify
#     mise run root:verify             the checks at once, then the walks in turn
#     mise run root:check-mise         misecheck on this very file: one line each, its Go there, usage by name, no shell syntax
#   tool: mise-seo itself, its binary and its packages
#     mise run tool:test               go vet, the Go tests (none of them walk), the release config
#     mise run tool:build              the binary, bin/mise-seo (.exe on Windows)
#     mise run tool:install            that build as the mise version local, the template's on this machine (and any repo's)
#     mise run tool:release            a release from the commit checked out, as release.yml runs it (--dry-run)
#   template: the template, templates/, a whole repo that runs where it is
#     mise run template:check-mise     misecheck on its tasks, both ways: the binary's Go, the walk, the skill, the docs page
#     mise run template:e2e            the walk on it, where it is: its tasks in the order a person meets them, each checked
#   new-repo: a new repo, made from nothing as docs/seo/README.md says, by the walk and gone after it
#     mise run new-repo:e2e            the walk on it (--version: at a release)
# Each runs what it needs first: run the furthest you need.
#
# This repo's pins are mise-check's, by its own tasks in .mise/, which mise-check init wrote: mise run mise-check.

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]
# mise 2026.10 fails to install a tool while it fetches its agent skill (a 404); it isn't needed.
skills.fetch = false

[tools]
usage = { version = "7.3.0", workflow = "publish-cli.yml" }    # --help and tab-completion for the tasks' flags
goreleaser = "2.20.0"   # the release's binaries (.goreleaser.yaml)

[tasks."root:ci"]
description = "What GitHub's CI runs (ci.yml runs exactly this), here the same: root:verify, and nothing CI adds"
run = "mise run root:verify"

[tasks."root:verify"]
description = "The checks and the walks: tool:test, root:check-mise and template:check-mise at once, then the walks one after the other (template:e2e, new-repo:e2e), as both serve an app and run its tasks"
depends = ["tool:test", "root:check-mise", "template:check-mise"]
run = "mise run template:e2e && mise run new-repo:e2e"

[tasks."root:check-mise"]
description = "TestRootMise on this repo's own mise.toml, the file this task is in: each task one line, the Go it runs there, its usage passed by name, no POSIX shell syntax, so every task here runs on Windows too; and the shape of a mise tool repo (misecheck.CheckToolRepo): root:ci and root:verify, ci.yml running only root:ci, the README's opening, no template task wrapping mise-check"
run = 'go test . -run "^TestRootMise$" -count=1 -v'

[tasks."tool:test"]
description = "go vet, every Go test, run for real (no cached results): the packages', the binary's, the template app's audit of itself and TestWithoutGsx (none of them walk), and the release config (goreleaser check)"
run = "go vet ./... && go test ./... -count=1 && goreleaser check"

[tasks."tool:build"]
description = "This repo's build, bin/mise-seo (mise-seo.exe on Windows: go build names it for the OS)"
run = "go build -o bin/ ./cmd/mise-seo"

[tasks."tool:install"]
description = "This checkout's build as the mise version local, for any repo on this machine, no release: mise use github:joeblew999/mise-seo@local there. The template pins a release in .mise/config.toml; this writes templates/.mise/config.local.toml, never committed, so the template runs this build here"
depends = ["tool:build"]
run = "mise link -f github:joeblew999/mise-seo@local {{config_root}}/bin && mise use -q --path {{config_root}}/templates/.mise/config.local.toml github:joeblew999/mise-seo@local"

[tasks."tool:release"]
description = "A release of mise-seo from the commit checked out, as release.yml runs it on GitHub: the commit's v* tag, or the next patch version tagged and pushed; goreleaser's binaries on that tag's release; a new repo made at it and walked (new-repo:e2e --version); the version on proxy.golang.org (the packages an app imports). --dry-run tags and publishes nothing (a goreleaser snapshot into dist/). After tool:test"
usage = 'flag "--dry-run" help="tag and publish nothing: goreleaser builds a snapshot into dist/"'
depends = ["tool:test"]
run = 'go test . -run "^TestToolRelease$" -count=1 -v -timeout 30m{% if usage.dry_run %} -args -dry-run{% endif %}'

[tasks."template:check-mise"]
description = "TestTemplateMise: misecheck on the template's tasks file, both ways: against the binary's Go (each task's command is its file, each command file is a task's, each flag on both sides), against the walk that runs them (each task it names is one), against the skill and the docs page (each names every task and flag, and only tasks there are), and the other files init writes that name its tasks"
run = 'go test . -run "^TestTemplateMise$" -count=1 -v'

[tasks."template:e2e"]
description = "TestWalkTemplate: the template, templates/, where it is: its tasks (seo:init to seo:inspect) in the order a person meets them, through its own mise file, each checked by what a person would see it do (e2e_steps_test.go): the app served and audited as Googlebot reads it, and each task that asks Google saying what key it needs. After tool:install"
depends = ["tool:install"]
run = 'go test . -run "^TestWalkTemplate$" -count=1 -v -timeout 15m'

[tasks."new-repo:e2e"]
description = "TestWalkNewRepo: a new repo, made from nothing as docs/seo/README.md says (an empty folder with its own git, mise-seo init, then seo:template: its app, its go.mod named for the folder), every numbered task each checked, in a folder of its own that goes when the walk ends. At this checkout's build (local, its go.mod using this checkout's packages), or the release --version names, as the release tries it. After tool:install"
usage = 'flag "--version <version>" help="make it at this release of mise-seo from GitHub, as mise exec does, instead of the build of this checkout"'
depends = ["tool:install"]
run = 'go test . -run "^TestWalkNewRepo$" -count=1 -v -timeout 15m{% if usage.version %} -args -version "{{usage.version}}"{% endif %}'
