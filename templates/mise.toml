# The template's little app's own tasks: Go, from go.mod (.mise/config.toml has mise install honour it), and nothing
# else. mise-seo's tasks are their own file, .mise/tasks/mise-seo.toml, and its pin .mise/config.toml, which mise-seo
# init writes (then mise run seo shows the way).

# setup and test are the tasks mise run seo:verify runs by name, here and on GitHub: every repo's, first.
[tasks.setup]
description = "Download the modules go.mod pins, mise-seo's packages among them (seo:verify runs it first)"
run = "go mod download"

[tasks.serve]
description = "Run the app: http://localhost:8080, seo.toml's site on this machine (ADDR to change it)"
run = "go run ./app"

[tasks.test]
description = "The app's own tests: its pages audited as Googlebot reads them (seo:verify runs them, then check)"
run = "go test ./..."
