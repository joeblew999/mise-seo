# mise-seo's CI: its own tests, itself on its own mise file, and its template (misecheck on its tasks, then the walk
# on the template where it is and on a new repo made from nothing), on Linux, macOS and Windows side by side (the
# point of it is that tasks run the same everywhere). Shell steps only, as mise-intl's: no JavaScript actions.
name: ci

# Once a change: a push to main, or a pull request (again for each push to its branch). Never a branch's push and its
# pull request both, nor a tag, whose commit main's push ran already.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # these steps are the workflow's own; mise runs the tasks in each OS's own shell
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # mise's GitHub downloads
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh, which fetches mise itself on Windows
      MISE_YES: "1"
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise and the pinned tools (mise.run, or mise's own Windows build)
        run: |
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else echo "$1"; fi; }
          mkdir -p "$HOME/.local/bin"
          native "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MISE_TRUSTED_CONFIG_PATHS=$(native "$PWD")" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            tag=$(gh release view -R jdx/mise --json tagName -q .tagName)
            curl -fsSL -o "$HOME/.local/bin/mise.exe" "https://github.com/jdx/mise/releases/download/$tag/mise-$tag-windows-x64.exe"
          else
            curl -fsSL https://mise.run | MISE_QUIET=1 sh
          fi
          export PATH="$HOME/.local/bin:$PATH" MISE_TRUSTED_CONFIG_PATHS="$(native "$PWD")"
          mise --version
          mise install

      - name: Everything, as on any machine (mise run root:ci)
        run: mise run root:ci
